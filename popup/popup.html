<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Koi Pond — Налаштування</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="preload">
    <main class="popup">
      <header class="banner">
        <canvas class="banner-canvas" id="pondBanner" aria-hidden="true"></canvas>
        <div class="banner-content">
          <div class="brand">
            <h1>Koi Pond</h1>
            <p>Піксельні коропи коі</p>
          </div>
          <label class="switch" title="Увімкнути або вимкнути ставок усюди">
            <input type="checkbox" id="enabledToggle" aria-label="Увімкнути ставок" />
            <span class="slider"></span>
          </label>
        </div>
      </header>

      <section class="site-bar">
        <span class="status-dot" id="statusDot"></span>
        <div class="site-text">
          <span class="site-host" id="siteHost">Завантаження…</span>
          <span class="site-state" id="siteState"></span>
        </div>
        <button class="btn-ghost" id="siteToggleBtn" type="button">Вимкнути тут</button>
      </section>

      <nav class="tabs" role="tablist" aria-label="Розділи налаштувань">
        <button type="button" role="tab" id="tabPond" data-tab="pond" aria-controls="panelPond">Ставок</button>
        <button type="button" role="tab" id="tabSites" data-tab="sites" aria-controls="panelSites">
          Сайти<span class="tab-count" id="siteCount"></span>
        </button>
      </nav>

      <div class="panels">
        <section class="panel" id="panelPond" role="tabpanel" aria-labelledby="tabPond">
          <div class="actions-row">
            <button class="btn-action btn-feed" id="feedBtn" type="button">Кинути корм</button>
            <button class="btn-action btn-respawn" id="respawnBtn" type="button">Нова зграйка</button>
          </div>

          <div class="card">
            <div class="range-row">
              <label for="fishCountRange">Рибок</label>
              <input type="range" id="fishCountRange" min="1" max="20" step="1" />
              <span class="value-badge" id="fishCountVal">7</span>
            </div>
            <div class="range-row">
              <label for="speedRange">Швидкість</label>
              <input type="range" id="speedRange" min="0.4" max="2.2" step="0.1" />
              <span class="value-badge" id="speedVal">1.0x</span>
            </div>
            <div class="range-row">
              <label for="opacityRange">Видимість</label>
              <input type="range" id="opacityRange" min="0.25" max="1" step="0.05" />
              <span class="value-badge" id="opacityVal">90%</span>
            </div>
          </div>

          <div class="card">
            <div class="mode-row">
              <span class="mode-label">Піксель</span>
              <div class="segmented" id="pixelScaleGroup" role="group" aria-label="Розмір пікселя">
                <button type="button" data-val="2">Дрібний</button>
                <button type="button" data-val="3">Середній</button>
                <button type="button" data-val="4">Великий</button>
              </div>
            </div>
            <div class="mode-row">
              <span class="mode-label">Шар</span>
              <div class="segmented" id="layerModeGroup" role="group" aria-label="Шар на сторінці">
                <button type="button" data-val="smart">Розумний</button>
                <button type="button" data-val="strict-behind">Позаду</button>
                <button type="button" data-val="ambient-top">Поверх</button>
              </div>
            </div>
            <div class="mode-row">
              <span class="mode-label">Курсор</span>
              <div class="segmented" id="cursorModeGroup" role="group" aria-label="Реакція на курсор">
                <button type="button" data-val="feed">Годувати</button>
                <button type="button" data-val="scatter">Лякати</button>
                <button type="button" data-val="none">Спокій</button>
              </div>
            </div>
            <div class="mode-row">
              <span class="mode-label">Кадри</span>
              <div class="segmented" id="fpsModeGroup" role="group" aria-label="Частота кадрів">
                <button type="button" data-val="auto">Авто</button>
                <button type="button" data-val="60">60</button>
                <button type="button" data-val="30">30</button>
              </div>
            </div>
            <div class="mode-row">
              <span class="mode-label">Кола на воді</span>
              <label class="switch switch-sm">
                <input type="checkbox" id="ripplesToggle" aria-label="Кола на воді" />
                <span class="slider"></span>
              </label>
            </div>
          </div>

          <p class="hint" id="pondHint"></p>
        </section>

        <section class="panel" id="panelSites" role="tabpanel" aria-labelledby="tabSites">
          <div class="segmented two" id="siteModeGroup" role="group" aria-label="Де працює ставок">
            <button type="button" data-val="blacklist">Усюди, крім списку</button>
            <button type="button" data-val="whitelist">Лише зі списку</button>
          </div>
          <p class="hint hint-left" id="siteModeHint"></p>

          <form class="add-row" id="siteAddForm" novalidate>
            <input
              type="text"
              id="siteInput"
              placeholder="example.com"
              autocomplete="off"
              spellcheck="false"
              aria-label="Адреса сайту"
            />
            <button class="btn-ghost" type="submit">Додати</button>
          </form>
          <p class="form-error" id="siteError" role="alert"></p>

          <ul class="site-list" id="siteList" aria-label="Список сайтів"></ul>
        </section>
      </div>
    </main>

    <script src="../src/shared/defaults.js"></script>
    <script src="../src/content/koi-renderer.js"></script>
    <script src="../src/content/pond-simulation.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
